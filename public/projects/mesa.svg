    <filter id="m-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#10140d" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#m-bg)"/>
  <g opacity=".045" stroke="#30382a">
    <path d="M0 100h1200M0 200h1200M0 300h1200M0 400h1200M0 500h1200M0 600h1200M0 700h1200"/>
    <path d="M100 0v800M200 0v800M300 0v800M400 0v800M500 0v800M600 0v800M700 0v800M800 0v800M900 0v800M1000 0v800M1100 0v800"/>
  </g>

  <g>
    <text x="48" y="78" fill="#242a20" font-family="Georgia, serif" font-size="40" font-weight="700" letter-spacing="-1.5">Mesa<tspan fill="#c35a2f">.</tspan></text>
    <text x="158" y="74" fill="#7d7768" font-family="Arial, sans-serif" font-size="9" letter-spacing="2.4">COCINA DE AUTOR</text>
    <g font-family="Arial, sans-serif" font-size="11" fill="#535649">
      <text x="680" y="74">Menú</text>
      <text x="746" y="74">Nosotros</text>
      <text x="834" y="74">Reservas</text>
      <text x="916" y="74">Contacto</text>
