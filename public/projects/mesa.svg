      <path d="M56 560h10M61 555v10" stroke="#5c5e50" stroke-width="1"/>
      <text x="86" y="556" fill="#30352c" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.6">RESERVAS ABIERTAS</text>
      <text x="86" y="572" fill="#858474" font-family="Arial, sans-serif" font-size="9">Mar — Dom · 19 a 23 h</text>
    </g>

    <text x="44" y="674" fill="#9a9785" font-family="Arial, sans-serif" font-size="8" letter-spacing="2.2">01 — 04</text>
