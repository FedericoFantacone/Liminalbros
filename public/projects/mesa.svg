    <path d="M0 106h1200" stroke="#242a20" stroke-opacity=".14"/>
  </g>

  <g>
    <text x="48" y="172" fill="#c35a2f" font-family="Arial, sans-serif" font-size="9" letter-spacing="2.6">TEMPORADA / VERANO</text>
    <text x="44" y="262" fill="#242a20" font-family="Georgia, serif" font-size="76" letter-spacing="-2.8">El sabor de</text>
    <text x="44" y="338" fill="#242a20" font-family="Georgia, serif" font-size="76" font-style="italic" letter-spacing="-2.8">la estación.</text>
    <text x="48" y="392" fill="#6c6b5e" font-family="Arial, sans-serif" font-size="13">Una cocina honesta, ingredientes locales y</text>
    <text x="48" y="412" fill="#6c6b5e" font-family="Arial, sans-serif" font-size="13">una mesa pensada para quedarse.</text>

    <rect x="48" y="458" width="142" height="43" rx="21.5" fill="#242a20"/>
    <text x="75" y="484" fill="#f4efe5" font-family="Arial, sans-serif" font-size="11" font-weight="700">Reservar mesa</text>
    <text x="210" y="484" fill="#4e5145" font-family="Arial, sans-serif" font-size="10" letter-spacing=".6">Ver menú →</text>

    <g>
