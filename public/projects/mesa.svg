<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="1" stop-color="#f2ecdf"/>
    </linearGradient>
    <linearGradient id="m-photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#566044"/>
      <stop offset=".55" stop-color="#30382a"/>
      <stop offset="1" stop-color="#1d221a"/>
    </linearGradient>
    <radialGradient id="m-plate" cx="42%" cy="32%" r="68%">
      <stop offset="0" stop-color="#f7f0df"/>
      <stop offset=".72" stop-color="#e6dbc5"/>
      <stop offset="1" stop-color="#c9bca2"/>
    </radialGradient>
    <radialGradient id="m-dish" cx="45%" cy="35%" r="65%">
      <stop offset="0" stop-color="#d88349"/>
      <stop offset=".6" stop-color="#b9572e"/>
      <stop offset="1" stop-color="#78331c"/>
    </radialGradient>
    <linearGradient id="m-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c9f5a"/>
      <stop offset="1" stop-color="#3f5128"/>
