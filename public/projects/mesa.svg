      <text x="48" y="744">VINOS NATURALES</text>
      <text x="48" y="762">PRODUCTO LOCAL</text>
    </g>
  </g>

  <g filter="url(#m-shadow)">
    <rect x="646" y="156" width="506" height="506" rx="253" fill="url(#m-photo)"/>
    <g opacity=".4" stroke="#ffffff">
      <circle cx="899" cy="409" r="210"/>
      <circle cx="899" cy="409" r="180"/>
    </g>
    <text x="899" y="620" fill="#e8e4d4" fill-opacity=".62" font-family="Georgia, serif" font-size="14" font-style="italic" text-anchor="middle">tomate · durazno · albahaca</text>

    <circle cx="899" cy="400" r="170" fill="url(#m-plate)"/>
    <circle cx="899" cy="400" r="145" fill="none" stroke="#c8bba3" stroke-opacity=".55"/>
    <circle cx="882" cy="392" r="96" fill="url(#m-dish)"/>
    <circle cx="858" cy="367" r="68" fill="#c76636" fill-opacity=".55"/>
    <path d="M824 426c40 16 90 12 122-16 12-10 18-23 20-36-33 20-74 29-116 22-16-3-29-8-41-15 0 19 6 35 15 45Z" fill="#8b421f" fill-opacity=".72"/>
    <g fill="url(#m-leaf)">
      <path d="M866 306c18-25 50-32 70-19-8 23-34 37-58 32-6-1-10-6-12-13Z"/>
      <path d="M937 369c27-9 52 2 59 23-22 14-49 8-61-10-3-5-2-9 2-13Z"/>
      <path d="M820 374c-20-17-18-44-3-58 20 12 27 37 17 54-3 6-8 7-14 4Z"/>
      <path d="M873 449c6-26 30-44 52-40-1 25-20 48-43 50-6 0-9-4-9-10Z"/>
    </g>
    <g fill="#efdfae">
      <circle cx="862" cy="334" r="4"/>
      <circle cx="944" cy="408" r="3"/>
      <circle cx="843" cy="430" r="3"/>
      <circle cx="906" cy="326" r="2.5"/>
      <circle cx="927" cy="447" r="3.5"/>
    </g>
    <path d="M862 407c20-16 49-17 68 0-10 22-54 28-68 0Z" fill="#f1d9ae" fill-opacity=".55"/>
  </g>

  <g>
    <rect x="646" y="694" width="506" height="62" fill="#242a20"/>
    <text x="670" y="721" fill="#f4efe5" font-family="Arial, sans-serif" font-size="8" letter-spacing="2">PRÓXIMA EXPERIENCIA</text>
    <text x="670" y="741" fill="#d8d4c4" font-family="Georgia, serif" font-size="15" font-style="italic">Cena maridada · 24 de febrero</text>
    <circle cx="1112" cy="725" r="19" fill="#c35a2f"/>
    <path d="M1106 725h12m-5-5 5 5-5 5" stroke="#f4efe5" fill="none" stroke-width="1.2"/>
